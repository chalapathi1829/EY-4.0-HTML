<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="background-color: aqua; width: 200vh; height: 70vh;">
        <div style="background-color: yellow; width: 60vh; height: 60vh; text-align: center;">
    <form>
        <h1>Registration Form</h1>
        <lable for="name">Name:</lable>
        <input type="text" id="name" placeholder="Enter your name" ><br><br>
        <lable for="email">Email:</lable>
        <input type="email" id="email" placeholder="Enter your email" ><br><br>
        <lable for="password">Password:</lable>
        <input type="password" id="password" placeholder="Enter your password" ><br><br>
        <lable for="dob">Date of Birth:</lable> 
        <input type="date" id="dob" required><br><br>
        <lable for="age">Age:</lable>
        <input type="number" id="age" min="18" max="32"><br><br>
        <lable for="color">Favorite Color:</lable>  
        <input type="color" id="color"><br><br>
        <input type="button" value="Submit">
        <input type="button" value="Reset">
    </form>
    </div><br>
    
    </div>  
</body>
</html>
